name: TrashCat AltTester Tests

# Two jobs:
#   compile — every push. Restores and builds the test project on GitHub's
#             own Windows runners. This does not need the game or a self-hosted PC.
#   smoke   — only when you click Run workflow. Starts AltTester Desktop,
#             launches the instrumented game, runs the tests, then closes
#             what it started. Needs a self-hosted Windows runner that is online.
# See README section "CI".

on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
    inputs:
      filter:
        description: 'NUnit category filter (e.g. "smoke"). Leave blank to run every test.'
        required: false
        default: ""

jobs:
  compile:
    name: Build test project
    runs-on: windows-latest
    timeout-minutes: 15
    concurrency:
      group: trashcat-compile-${{ github.ref }}
      cancel-in-progress: true

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore & build test project
        run: |
          dotnet restore tests/TrashCat.Tests/TrashCat.Tests.csproj
          dotnet build tests/TrashCat.Tests/TrashCat.Tests.csproj --no-restore -c Release

  smoke:
    name: AltTester smoke on self-hosted Windows
    # A push must not sit in "Waiting for a runner". Game tests run only
    # from the Actions "Run workflow" button, and only after compile succeeds.
    if: github.event_name == 'workflow_dispatch'
    needs: compile
    runs-on: [self-hosted, windows]
    timeout-minutes: 30
    concurrency:
      # One Unity + AltTester session at a time on the lab machine.
      group: trashcat-alttester
      cancel-in-progress: false

    defaults:
      run:
        shell: pwsh

    env:
      # Path to the instrumented Windows player on the runner. Override with a repo
      # variable named GAME_EXE if the file lives somewhere else on your machine.
      GAME_EXE: ${{ vars.GAME_EXE || 'App/TrashCatWindows/TrashCat.exe' }}
      ALT_DRIVER_HOST: 127.0.0.1
      ALT_DRIVER_PORT: "13000"
      RECORD_VIDEO: "1"
      RECORD_FRAME_MS: "500"
      # The smoke job starts AltTester, then run-tests.ps1 launches the game.
      LAUNCH_GAME: "1"
      ALTTESTER_DESKTOP_EXE: ${{ vars.ALTTESTER_DESKTOP_EXE }}
      ALTTESTER_LICENSE: ${{ secrets.ALTTESTER_LICENSE }}
      TEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      # Keep the raw Allure JSONs on the runner's disk so allure generate always finds them.
      REPORT_ROOT: reports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          dotnet --version
          node --version
          try { allure --version } catch { Write-Warning "allure CLI not found on PATH" }
          try { ffmpeg -version | Select-Object -First 1 } catch { Write-Warning "ffmpeg not found on PATH" }

      - name: Restore & build test project
        run: |
          dotnet restore tests/TrashCat.Tests/TrashCat.Tests.csproj
          dotnet build tests/TrashCat.Tests/TrashCat.Tests.csproj --no-restore -c Release

      - name: Start AltTester server
        run: pwsh scripts/alttester-server.ps1 -Action Start

      - name: Preflight (game exe + tooling)
        run: npm run preflight

      - name: Run tests
        timeout-minutes: 20
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FILTER)) {
            pwsh scripts/run-tests.ps1
          } else {
            pwsh scripts/run-tests.ps1 -Filter $env:FILTER
          }

      - name: Stop AltTester server
        if: always()
        run: pwsh scripts/alttester-server.ps1 -Action Stop

      - name: Generate Allure HTML report
        if: always()
        run: npm run report

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/allure-report/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload raw Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/allure-results/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload run recording, log, screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/videos/**
            reports/logs/**
            reports/screenshots/**
          if-no-files-found: warn
          retention-days: 14
